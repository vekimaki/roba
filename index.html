<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#6a1b9a">
<title>Alfa lek · Roba</title>
<!--
  ALFA LEK · ROBA - zajednička aplikacija za telefon i računar (GitHub Pages)
  Verzija 1.0 (16. 11. 2026)
    - početni ekran sa pločicama: Prijem robe (sada), Pakovanje i Popis (kasnije)
    - svaka pločica ima svoju skriptu (/exec) i svoj ključ; korisnik vidi samo pločice čiji ključ skripta prihvata;
      ako vidi samo jednu, aplikacija odmah otvara nju
    - zajedničko skeniranje: kamera uživo, slikanje barkoda, kucanje i BAR KOD ČITAČ (radi kao tastatura)
    - prekidač Brzo (svako skeniranje = 1 kom odmah) / Sa karticom (kartica sa količinom, Enter čuva)
    - Prijem robe = isto kao verzija 4.2 (čuvanje u pozadini, brisanje prijema, provera)
  Link: https://vekimaki.github.io/roba/?k=KLJUČ  (ključevi su u tabu Apoteke u tabeli Prijem robe)
-->
<style>
  :root {
    --ljub: #6a1b9a; --ljub2: #8e24aa;
    --njezna: #8a6fc4; --plava: #5b7a99; --obrub: #6f4fb8;
    --zel: #43a047; --crv: #c62828; --nar: #fb8c00; --siva: #6b6b6b;
    --poz: #f5f5f7; --bela: #ffffff; --tekst: #212121; --dok: #ede7f6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--poz); color: var(--tekst); font-size: 15px; }
  header { background: linear-gradient(90deg, var(--ljub), var(--ljub2)); color: #fff; padding: 9px 12px;
    display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { background: rgba(255,255,255,.18); border: 0; color: #fff; font-size: 16px; border-radius: 9px; padding: 5px 9px; }
  main { padding: 10px; max-width: 640px; margin: 0 auto; }

  .dugme { display: block; width: 100%; border: 0; border-radius: 12px; padding: 11px; font-size: 16px; font-weight: bold;
    color: #fff; margin: 6px 0; cursor: pointer; }
  .dugme:disabled { opacity: .45; }
  .zeleno { background: var(--zel); } .njezno { background: var(--njezna); } .plavo { background: var(--plava); }
  .obrub { background: #fff; color: var(--obrub); border: 2px solid var(--obrub); }
  .obrub-crv { background: #fff; color: var(--crv); border: 2px solid var(--crv); }
  .malo { padding: 7px 10px; font-size: 14px; border-radius: 9px; width: auto; display: inline-block; margin: 0; }
  .red2 { display: flex; gap: 8px; } .red2 .dugme { flex: 1; }

  .kartica { background: var(--bela); border-radius: 12px; padding: 9px 12px; margin: 6px 0; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .kartica.klik { cursor: pointer; }
  .naslov { font-weight: bold; font-size: 15px; }
  .sitno { color: var(--siva); font-size: 12px; margin-top: 3px; }
  .grupa { font-weight: bold; color: var(--ljub); margin: 14px 4px 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; }

  /* početni ekran */
  .pozdrav { margin: 8px 4px 12px; color: #444; }
  .ploca { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 14px; margin: 10px 0;
    box-shadow: 0 1px 4px rgba(0,0,0,.14); cursor: pointer; }
  .ploca .ik { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; flex: 0 0 52px; }
  .ploca .ime { font-weight: bold; font-size: 17px; }
  .ploca.nedostupno { opacity: .5; cursor: default; }

  /* okvir dokumenta */
  .dokument { background: var(--dok); border-left: 6px solid var(--ljub); border-radius: 12px; padding: 10px 12px; margin: 4px 0 6px; box-shadow: 0 1px 3px rgba(0,0,0,.10); }
  .dokument .oznaka { font-size: 12px; font-weight: bold; color: var(--ljub); text-transform: uppercase; letter-spacing: .6px; }
  .dokument .naslov { font-size: 17px; margin-top: 2px; }
  .dokRed { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #fff; border-radius: 10px; padding: 7px 10px; margin-top: 8px; }
  .dokRed .vr { font-size: 16px; font-weight: bold; } .dokRed .lbl { font-size: 12px; color: var(--siva); }
  .dokument input { font-size: 16px; padding: 8px; }
  .razmak { height: 6px; }
  .deo { font-weight: bold; color: #444; margin: 16px 4px 2px; font-size: 14px; }

  .cip { display: inline-block; padding: 3px 9px; border-radius: 10px; font-size: 12px; font-weight: bold; color: #fff; float: right; }
  .st-Skeniranje { background: #1e88e5; } .st-Za-proveru { background: var(--nar); } .st-U-redu { background: var(--zel); }
  .st-Ima-grešaka { background: var(--crv); } .st-Nema-dokumenta { background: #757575; }

  label { display: block; font-size: 13px; color: var(--siva); margin: 10px 0 3px; }
  input, select, textarea { width: 100%; font-size: 16px; padding: 9px 10px; border: 2px solid #d1c4e9; border-radius: 10px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ljub2); }
  .izbor { display: flex; gap: 8px; } .izbor button { flex: 1; padding: 10px; font-size: 15px; border-radius: 10px; border: 2px solid var(--obrub);
    background: #fff; color: var(--obrub); font-weight: bold; } .izbor button.akt { background: var(--obrub); color: #fff; }

  /* prekidač režima skeniranja */
  .prekidac { display: flex; background: #e8e3f3; border-radius: 10px; padding: 3px; gap: 3px; margin: 2px 0 8px; }
  .prekidac button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 8px; font-size: 14px; font-weight: bold; color: var(--obrub); }
  .prekidac button.akt { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .prekidac button:focus { outline: none; }
  .alatke { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .link { background: none; border: 0; color: var(--obrub); font-size: 13px; font-weight: bold; padding: 4px 0; text-decoration: underline; }

  .komad { color: var(--crv); font-weight: bold; }
  .upoz { background: #ffebee; color: var(--crv); border-radius: 10px; padding: 8px 10px; font-weight: bold; margin: 8px 0; }
  .info { background: #eef1f6; color: #33475b; border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
  .ok { background: #e8f5e9; color: #1b5e20; border-radius: 10px; padding: 8px 10px; margin: 8px 0; font-weight: bold; }
  .greska { background: #ffebee; color: var(--crv); border-radius: 10px; padding: 8px 10px; margin: 8px 0; }

  .kol { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .kol button { width: 52px; height: 52px; font-size: 26px; border-radius: 12px; border: 2px solid var(--obrub); background: #fff; color: var(--obrub); font-weight: bold; }
  .kol input { text-align: center; font-size: 24px; font-weight: bold; height: 52px; }

  #video { width: 100%; border-radius: 14px; background: #000; max-height: 42vh; object-fit: cover; display: block; }
  .okvir { position: relative; }
  .nisan { position: absolute; left: 12%; right: 12%; top: 38%; height: 24%; border: 3px solid rgba(255,255,255,.9); border-radius: 10px; pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.18); }
  .poslednje { background: #fff; border-radius: 12px; padding: 6px 12px; margin: 8px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .poslednje .r { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .poslednje .r:last-child { border-bottom: 0; }

  .stavka { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .stavka .k { font-size: 18px; font-weight: bold; color: var(--ljub); white-space: nowrap; }
  .legenda span { display: inline-block; margin: 2px 4px 2px 0; padding: 3px 8px; border-radius: 8px; font-size: 13px; font-weight: bold; }

  #cekaj { position: fixed; inset: 0; background: rgba(255,255,255,.7); display: none; align-items: center; justify-content: center; z-index: 20;
    font-size: 18px; font-weight: bold; color: var(--ljub); flex-direction: column; gap: 12px; }
  .vrtesca { width: 44px; height: 44px; border: 5px solid #d1c4e9; border-top-color: var(--ljub2); border-radius: 50%; animation: vrti 1s linear infinite; }
  @keyframes vrti { to { transform: rotate(360deg); } }
  #poruka { position: fixed; left: 12px; right: 12px; bottom: 16px; padding: 11px; border-radius: 12px; color: #fff; font-weight: bold;
    display: none; z-index: 30; text-align: center; font-size: 15px; }
  .skriveno { display: none !important; }
  .ceka { color: #8a6fc4; font-size: 12px; font-weight: bold; }
  .filter { margin: 4px 0 8px; }
  .verzija { text-align: center; color: #aaa; font-size: 11px; margin: 24px 0 8px; }
</style>
</head>
<body>
<header>
  <button id="nazad" class="skriveno" onclick="nazad()">←</button>
  <h1 id="naslov">Alfa lek · Roba</h1>
  <button id="kuca" class="skriveno" onclick="pocetna()" title="Početna">⌂</button>
  <button onclick="osvezi()" title="Osveži">↻</button>
</header>
<main id="ekran"></main>
<div id="cekaj"><div class="vrtesca"></div><div id="cekajTekst">Učitavam...</div></div>
<div id="poruka"></div>
<input type="file" id="foto" accept="image/*" capture="environment" class="skriveno">

<script>
const VERZIJA_APP = '1.0';
const K = (new URLSearchParams(location.search).get('k') || '').trim();

/* ================= MODULI (pločice) =================
   api = Web app URL skripte (/exec). Pločica bez api-ja se ne prikazuje. */
const MODULI = [
  { id: 'prijem', naziv: 'Prijem robe', opis: 'Kontrola primljene robe', ikona: '📦', boja: '#8a6fc4',
    api: 'https://script.google.com/macros/s/AKfycbyh8jTOQ9DcD7grsnin_ZiGMzEFZPGETWaHKZ43hv-s8rS1U4Czou3sOKP4YhFbGSPKzw/exec',
    otvori: function (r) { prijemStart(r); } },
  { id: 'pakovanje', naziv: 'Pakovanje', opis: 'Pakovanje internih prenosa u magacinu', ikona: '🚚', boja: '#00acc1', api: '', otvori: null },
  { id: 'popis', naziv: 'Popis', opis: 'Popis robe', ikona: '📋', boja: '#fb8c00', api: '', otvori: null }
];
const APP = { dostupni: [], aktivni: null };

/* Poziv funkcije u skripti (POST, običan tekst - bez dodatne dozvole pretraživača). */
function poziv(url, fn, args) {
  return fetch(url, { method: 'POST', body: JSON.stringify({ fn: fn, k: K, args: args || [] }) })
    .catch(function () { throw new Error('Nema veze sa serverom. Proverite internet i pokušajte ponovo.'); })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      let o;
      try { o = JSON.parse(t); } catch (e) { throw new Error('Server je vratio neočekivan odgovor. Pokušajte ponovo.'); }
      if (!o.ok) throw new Error(o.greska || 'Greška na serveru.');
      return o.rez;
    });
}
function modul(id) { return MODULI.filter(function (m) { return m.id === id; })[0]; }

/* ================= POMOĆNE ================= */
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function $(id) { return document.getElementById(id); }
function cekaj(t) { $('cekajTekst').textContent = t || 'Učitavam...'; $('cekaj').style.display = 'flex'; }
function gotovo() { $('cekaj').style.display = 'none'; }
function poruka(t, boja) {
  const p = $('poruka'); p.textContent = t; p.style.background = boja || '#43a047'; p.style.display = 'block';
  clearTimeout(poruka.t); poruka.t = setTimeout(function () { p.style.display = 'none'; }, 3500);
}
function greska(e) { gotovo(); poruka((e && e.message) ? e.message : String(e), '#c62828'); }
function lsGet(k) { try { const v = localStorage.getItem('roba_' + k); return v !== null ? v : localStorage.getItem('prijem_' + k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem('roba_' + k, v); } catch (e) {} }
function cipStatusa(st) { return '<span class="cip st-' + esc(String(st).replace(/ /g, '-')) + '">' + esc(st) + '</span>'; }
function confirmLako(t) { try { return window.confirm(t); } catch (e) { return true; } }
function jeRacunar() { return !('ontouchstart' in window) && !(navigator.maxTouchPoints > 0); }
function zvuk(ok) {
  try { if (navigator.vibrate) navigator.vibrate(ok ? 80 : [80, 60, 80]); } catch (e) {}
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator();
    o.frequency.value = ok ? 1200 : 300; o.connect(c.destination); o.start(); setTimeout(function () { o.stop(); c.close(); }, 120);
  } catch (e) {}
}
function postaviNaslov(t, nazadVidljivo) {
  $('naslov').textContent = t; $('nazad').classList.toggle('skriveno', !nazadVidljivo);
  $('kuca').classList.toggle('skriveno', APP.dostupni.length < 2 || S.ekran === 'pocetna');
}

/* ================= POČETAK I POČETNI EKRAN ================= */
function start() {
  if (!K) {
    $('ekran').innerHTML = '<div class="greska">Link nije potpun (nedostaje ključ). Otvorite link koji ste dobili.</div>';
    return;
  }
  cekaj('Učitavam...');
  const sa = MODULI.filter(function (m) { return m.api; });
  Promise.all(sa.map(function (m) {
    return poziv(m.api, 'apiPocetak').then(function (r) { return { m: m, r: r }; }, function (e) { return { m: m, e: e }; });
  })).then(function (lista) {
    gotovo();
    APP.dostupni = lista.filter(function (x) { return !x.e; });
    if (!APP.dostupni.length) {
      const g = lista[0] && lista[0].e;
      $('ekran').innerHTML = '<div class="greska">' + esc(g ? g.message : 'Nijedan deo aplikacije nije dostupan.') + '</div>' +
        '<button class="dugme obrub" onclick="start()">Pokušaj ponovo</button>';
      return;
    }
    ucitajSifarnik().catch(function (e) { poruka('Šifarnik nije učitan: ' + e.message, '#c62828'); });
    if (APP.dostupni.length === 1) return otvoriModul(APP.dostupni[0].m.id);
    pocetna();
  });
}

function pocetna() {
  if (RED.lista.length && !confirmLako('Još se čuvaju stavke. Ipak izaći na početni ekran?')) return;
  zaustaviKameru();
  S.ekran = 'pocetna'; APP.aktivni = null;
  postaviNaslov('Alfa lek · Roba', false);
  let h = '<div class="pozdrav">Izaberite:</div>';
  MODULI.forEach(function (m) {
    const d = APP.dostupni.filter(function (x) { return x.m.id === m.id; })[0];
    if (!d) return;
    h += '<div class="ploca" onclick="otvoriModul(\'' + m.id + '\')"><div class="ik" style="background:' + m.boja + '">' + m.ikona + '</div>' +
      '<div><div class="ime">' + esc(m.naziv) + '</div><div class="sitno">' + esc(m.opis) + '</div></div></div>';
  });
  h += '<div class="verzija">Alfa lek · Roba ' + VERZIJA_APP + '</div>';
  $('ekran').innerHTML = h;
}

function otvoriModul(id) {
  const d = APP.dostupni.filter(function (x) { return x.m.id === id; })[0];
  if (!d) return;
  APP.aktivni = id;
  d.m.otvori(d.r);
}

function osvezi() {
  if (APP.aktivni === 'prijem') return prijemOsvezi();
  start();
}

function nazad() {
  if (APP.aktivni === 'prijem') return prijemNazad();
  pocetna();
}

/* ================= ŠIFARNIK (zajednički, čuva se na telefonu) ================= */
const SIF = { a: [], mapa: {}, komad: {}, ok: false };
function ucitajSifarnik() {
  try { const st = lsGet('sifarnik'); if (st) primeniSifarnik(JSON.parse(st)); } catch (e) {}
  const izvor = APP.dostupni[0].m;   // šifarnik daje prva dostupna skripta (svi koriste isti)
  return poziv(izvor.api, 'apiSifarnik', [lsGet('sifarnikVerzija') || '']).then(function (r) {
    if (r && !r.isti) {
      lsSet('sifarnik', JSON.stringify({ a: r.a, b: r.b }));
      lsSet('sifarnikVerzija', r.verzija);
      primeniSifarnik(r);
    }
  });
}
function bezNula(b) { return String(b).replace(/^0+/, ''); }
function primeniSifarnik(r) {
  SIF.a = r.a || []; SIF.mapa = {}; SIF.komad = {};
  SIF.a.forEach(function (a) { if (a[2] === 1) SIF.komad[a[0]] = true; });
  (r.b || []).forEach(function (x) { SIF.mapa[x[0]] = x[1]; const n = bezNula(x[0]); if (!(n in SIF.mapa)) SIF.mapa[n] = x[1]; });
  SIF.ok = SIF.a.length > 0;
}
/** GS1 DataMatrix sa lekova: (01)GTIN14... -> EAN-13 */
function ocistiKod(k) {
  k = String(k || '').replace(/[\u001d\s]/g, '').replace(/^\]d2/, '').replace(/^\]C1/, '');
  const m = k.match(/^\(?01\)?(\d{14})/);
  if (m) return m[1].replace(/^0/, '');
  return k;
}
function nadjiArtikal(kod) {
  const k = ocistiKod(kod);
  let i = SIF.mapa[k]; if (i === undefined) i = SIF.mapa[bezNula(k)];
  if (i === undefined) return null;
  const a = SIF.a[i]; return { id: a[0], naziv: a[1], komad: a[2] === 1, barkod: k };
}
function jeKomad(idArtikla) { return !!SIF.komad[idArtikla]; }

/* ================= ČUVANJE U POZADINI =================
   Stavka se odmah prikaže, a šalje se skripti jedna po jedna. Ako veza pukne, slanje se ponavlja
   (do 3 puta); skripta prepoznaje ponovljenu stavku po ID-ju i ne upisuje je dvaput. */
const RED = { lista: [], radi: false, cekaju: [] };
function noviId() {
  try { const b = new Uint8Array(6); crypto.getRandomValues(b); return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
  catch (e) { return (Date.now().toString(16) + Math.random().toString(16).slice(2)).slice(-12); }
}
/* z = {url, fn, args, naziv, kol, lokalna, ukloni()} */
function uRed(z) { z.pokusaj = 0; RED.lista.push(z); osveziBrojac(); obradiRed(); }
function obradiRed() {
  if (RED.radi) return;
  const z = RED.lista[0];
  if (!z) { osveziBrojac(); const c = RED.cekaju; RED.cekaju = []; c.forEach(function (f) { f(); }); return; }
  RED.radi = true; osveziBrojac();
  poziv(z.url, z.fn, z.args).then(function () {
    if (z.lokalna) z.lokalna.ceka = false; RED.lista.shift();
  }).catch(function (e) {
    z.pokusaj++;
    if (z.pokusaj < 3) return new Promise(function (r) { setTimeout(r, 2000); });   // pokušaj ponovo za 2 s
    RED.lista.shift();
    if (z.ukloni) z.ukloni();
    zvuk(false);
    poruka('NIJE sačuvano: ' + z.naziv + ' × ' + z.kol + ' (' + e.message + '). Unesite ponovo.', '#c62828');
    if (S.ekran === 'prijem') prikaziPrijem();
  }).then(function () { RED.radi = false; obradiRed(); });
}
function sacekajRed() {
  return new Promise(function (res) { if (!RED.lista.length && !RED.radi) res(); else RED.cekaju.push(res); });
}
function osveziBrojac() {
  const n = RED.lista.length, el = $('redStatus');
  if (el) el.textContent = n ? '⏳ čuva se još ' + n + '...' : '';
  osveziPoslednje();
}
function posleCuvanja(f) {
  if (!RED.lista.length && !RED.radi) return f();
  cekaj('Čuvam preostale stavke...');
  sacekajRed().then(function () { gotovo(); f(); });
}
window.addEventListener('beforeunload', function (e) {
  if (RED.lista.length) { e.preventDefault(); e.returnValue = 'Još se čuvaju stavke.'; return e.returnValue; }
});

/* ================= SKENIRANJE (zajedničko) =================
   Izvori koda: kamera uživo, slikanje barkoda, kucanje, bar kod čitač (tastatura: brzi niz znakova + Enter).
   Režim: 'brzo' (svako skeniranje = 1 kom odmah; artikal na komad ipak otvara karticu) ili 'kartica'. */
const SKEN = {
  rezim: lsGet('rezim') === 'brzo' ? 'brzo' : 'kartica',
  kamera: lsGet('kamera') !== 'ne',
  ekrani: ['skener', 'rucno', 'prijem'],     // ekrani na kojima čitač radi
  primi: null                                // funkcija modula: primi(kod, namerno)
};
function postaviRezim(r) { SKEN.rezim = r; lsSet('rezim', r); const a = $('rzB'), b = $('rzK'); if (a) { a.classList.toggle('akt', r === 'brzo'); b.classList.toggle('akt', r !== 'brzo'); } }
function prekidacHtml() {
  return '<div class="prekidac"><button id="rzB" class="' + (SKEN.rezim === 'brzo' ? 'akt' : '') + '" onclick="postaviRezim(\'brzo\')">⚡ Brzo (1 kom)</button>' +
    '<button id="rzK" class="' + (SKEN.rezim !== 'brzo' ? 'akt' : '') + '" onclick="postaviRezim(\'kartica\')">🗂️ Sa karticom</button></div>';
}

/* --- bar kod čitač: hvata brzi niz znakova koji se završava Enterom, bez obzira gde je kursor --- */
const CIT = { buf: '', t0: 0, tz: 0, polja: [] };   // polja = [[polje, vrednost pre niza], ...]
document.addEventListener('keydown', function (e) {
  if (SKEN.ekrani.indexOf(S.ekran) < 0) return;
  const sad = Date.now();
  if (e.key === 'Enter') {
    const n = CIT.buf.length;
    const citac = n >= 6 && (CIT.tz - CIT.t0) / Math.max(1, n - 1) < 45 && sad - CIT.tz < 200;
    const kod = CIT.buf; CIT.buf = '';
    if (citac) {
      e.preventDefault();
      // znakove koje je čitač ukucao u neko polje (npr. količinu) vrati na staro
      CIT.polja.forEach(function (x) { if (x[0].id !== 'rucniKod') x[0].value = x[1]; });
      CIT.polja = [];
      if ($('rucniKod')) $('rucniKod').value = '';
      if (SKEN.primi) SKEN.primi(kod, true);
      return;
    }
    // običan Enter: potvrdi otvorenu karticu, ili kucani barkod
    if ($('dugSacuvaj') && !$('dugSacuvaj').disabled) { e.preventDefault(); $('dugSacuvaj').click(); return; }
    if (document.activeElement && document.activeElement.id === 'rucniKod') { e.preventDefault(); $('dugOK').click(); }
    return;
  }
  if (e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey) return;
  if (!CIT.buf || sad - CIT.tz > 80) { CIT.buf = ''; CIT.t0 = sad; CIT.polja = []; }
  // zapamti vrednost svakog polja u koje niz upada (kursor može da pređe u polje usred niza)
  const el = document.activeElement;
  if (el && typeof el.value === 'string' && !CIT.polja.some(function (x) { return x[0] === el; })) CIT.polja.push([el, el.value]);
  CIT.buf += e.key; CIT.tz = sad;
});

/* --- kamera --- */
const CAM = { stream: null, detektor: null, zxing: null, radi: false, pauza: false, tajmer: null, zadnji: '', vidjen: 0 };

function formatiPodrzani() {
  const zeljeni = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'data_matrix', 'qr_code'];
  if (!window.BarcodeDetector || !BarcodeDetector.getSupportedFormats) return Promise.resolve(zeljeni);
  return BarcodeDetector.getSupportedFormats().then(function (f) { return zeljeni.filter(function (z) { return f.indexOf(z) >= 0; }); });
}

/* deo ekrana za skeniranje: prekidač, kamera, status, kucanje */
function skenerDeo() {
  return prekidacHtml() +
    '<div id="kamDeo" class="okvir' + (SKEN.kamera ? '' : ' skriveno') + '"><video id="video" playsinline muted></video><div class="nisan"></div></div>' +
    '<div class="alatke"><div id="kamStatus" class="sitno"></div><button class="link" onclick="prebaciKameru()">' + (SKEN.kamera ? 'Isključi kameru' : 'Uključi kameru') + '</button></div>' +
    '<div id="nadjeno"></div>';
}
function pokreniSkener() {
  if (!SKEN.kamera) {
    $('kamStatus').textContent = jeRacunar() ? 'Skenirajte bar kod čitačem ili ukucajte barkod.' : 'Kamera je isključena.';
    return;
  }
  $('kamStatus').textContent = SIF.ok ? 'Uključujem kameru...' : 'Šifarnik se još učitava, sačekajte trenutak...';
  pokreniKameru();
}
function prebaciKameru() {
  SKEN.kamera = !SKEN.kamera; lsSet('kamera', SKEN.kamera ? 'da' : 'ne');
  zaustaviKameru();
  if (S.ekran === 'skener') skener();
}

function pokreniKameru() {
  CAM.pauza = false;
  const ekran = S.ekran;
  if (window.BarcodeDetector) {
    formatiPodrzani().then(function (formati) {
      CAM.detektor = new BarcodeDetector({ formats: formati });
      return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
    }).then(function (stream) {
      CAM.stream = stream; const v = $('video'); if (!v || S.ekran !== ekran) return zaustaviKameru();
      v.srcObject = stream; return v.play();
    }).then(function () {
      if (S.ekran !== ekran || !CAM.stream) return;
      CAM.radi = true; if ($('kamStatus')) $('kamStatus').textContent = 'Usmerite kameru na barkod.';
      petljaDetekcije(ekran);
    }).catch(kameraNeRadi);
  } else {
    ucitajZxing().then(function () {
      CAM.zxing = new ZXing.BrowserMultiFormatReader();
      return CAM.zxing.decodeFromConstraints({ video: { facingMode: 'environment' } }, 'video', function (rez) {
        if (rez) kameraKod(rez.getText());
      });
    }).then(function () {
      CAM.radi = true; if ($('kamStatus')) $('kamStatus').textContent = 'Usmerite kameru na barkod.';
    }).catch(kameraNeRadi);
  }
}

function kameraNeRadi(e) {
  zaustaviKameru();
  if ($('kamDeo')) $('kamDeo').classList.add('skriveno');
  const odbijeno = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
  if ($('kamStatus')) $('kamStatus').innerHTML =
    odbijeno ? 'Kamera nije dozvoljena (katanac levo od adrese → Dozvole → Kamera). Možete slikati, ukucati ili skenirati čitačem.'
             : 'Kamera nije dostupna. Skenirajte bar kod čitačem, slikajte ili ukucajte barkod.';
}

function petljaDetekcije(ekran) {
  if (!CAM.radi || S.ekran !== ekran) return;
  const v = $('video');
  if (v && v.readyState >= 2) {
    CAM.detektor.detect(v).then(function (k) {
      if (k && k.length) kameraKod(k[0].rawValue);
    }).catch(function () {}).then(function () { CAM.tajmer = setTimeout(function () { petljaDetekcije(ekran); }, 180); });
  } else {
    CAM.tajmer = setTimeout(function () { petljaDetekcije(ekran); }, 250);
  }
}

/* Ista kutija ispred kamere se ne čita ponovo dok se ne skloni iz kadra (bar 1,2 s). */
function kameraKod(kod) {
  const sad = Date.now();
  if (kod === CAM.zadnji) {
    const proslo = sad - CAM.vidjen; CAM.vidjen = sad;
    if (proslo < 1200) return;
  }
  if (CAM.pauza) return;
  CAM.zadnji = kod; CAM.vidjen = sad;
  if (SKEN.primi) SKEN.primi(kod, false);
}

function zaustaviKameru() {
  CAM.radi = false; clearTimeout(CAM.tajmer);
  try { if (CAM.zxing) CAM.zxing.reset(); } catch (e) {}
  CAM.zxing = null;
  if (CAM.stream) { CAM.stream.getTracks().forEach(function (t) { t.stop(); }); CAM.stream = null; }
}

function ucitajZxing() {
  if (window.ZXing) return Promise.resolve();
  return new Promise(function (res, rej) {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = res; s.onerror = function () { rej(new Error('Biblioteka za skeniranje nije učitana.')); };
    document.head.appendChild(s);
  });
}

/* fotografija barkoda */
$('foto').addEventListener('change', function () {
  const f = this.files && this.files[0]; this.value = '';
  if (!f) return;
  cekaj('Čitam barkod sa slike...');
  const url = URL.createObjectURL(f);
  procitajSaSlike(url).then(function (kod) {
    gotovo(); URL.revokeObjectURL(url);
    if (kod) { if (SKEN.primi) SKEN.primi(kod, true); }
    else { zvuk(false); poruka('Barkod nije pročitan. Slikajte bliže i oštrije.', '#c62828'); }
  }).catch(function (e) { URL.revokeObjectURL(url); greska(e); });
});
function procitajSaSlike(url) {
  if (window.BarcodeDetector) {
    return formatiPodrzani().then(function (formati) {
      const det = new BarcodeDetector({ formats: formati });
      const img = new Image(); img.src = url;
      return img.decode().then(function () { return det.detect(img); }).then(function (k) { return k && k.length ? k[0].rawValue : ''; });
    });
  }
  return ucitajZxing().then(function () {
    const r = new ZXing.BrowserMultiFormatReader();
    return r.decodeFromImageUrl(url).then(function (x) { return x.getText(); }).catch(function () { return ''; });
  });
}

/* =====================================================================
   MODUL: PRIJEM ROBE  (skripta PrijemRobe 4.2)
   ===================================================================== */
const S = { apoteka: '', admin: false, apoteke: [], prijemi: [], filter: '', prijem: null, ekran: 'pocetna', izmenaBroja: false };
const STATUSI = ['Skeniranje', 'Za proveru', 'Nema dokumenta', 'Ima grešaka', 'U redu'];
function apiP(fn) { return poziv(modul('prijem').api, fn, Array.prototype.slice.call(arguments, 1)); }

function prijemStart(r) {
  S.apoteka = r.apoteka; S.admin = r.admin; S.apoteke = r.apoteke; S.prijemi = r.prijemi;
  SKEN.primi = prijemKod;
  lista();
}

function prijemOsvezi() {
  if (S.ekran === 'prijem' && S.prijem) { const id = S.prijem.prijem.id; return posleCuvanja(function () { otvoriPrijem(id); }); }
  if (S.ekran === 'skener' || S.ekran === 'rucno' || S.ekran === 'stavka' || S.ekran === 'rezultat') return;
  cekaj('Osvežavam...');
  apiP('apiPrijemi').then(function (p) { S.prijemi = p; gotovo(); lista(); }).catch(greska);
}

function prijemNazad() {
  zaustaviKameru();
  if (S.ekran === 'rucno') return skener();
  if (S.ekran === 'skener' || S.ekran === 'rezultat' || S.ekran === 'stavka') return prikaziPrijem();
  if (S.ekran === 'lista') return pocetna();
  lista();
  prijemOsvezi();
}

/* ---------- lista prijema ---------- */
function lista() {
  zaustaviKameru();
  S.ekran = 'lista'; S.prijem = null;
  postaviNaslov('Prijem robe · ' + (S.admin ? 'sve apoteke' : S.apoteka), APP.dostupni.length > 1);
  let h = '<button class="dugme zeleno" onclick="noviPrijem()">+ Novi prijem</button>';
  if (S.admin) {
    h += '<select class="filter" onchange="S.filter=this.value;lista()"><option value="">Sve apoteke</option>' +
      S.apoteke.map(function (a) { return '<option' + (S.filter === a ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('') + '</select>';
  }
  const pr = S.prijemi.filter(function (p) { return !S.filter || p.apoteka === S.filter; });
  if (!pr.length) h += '<div class="info">Nema prijema. Kliknite „+ Novi prijem“.</div>';
  STATUSI.forEach(function (st) {
    const g = pr.filter(function (p) { return p.status === st; });
    if (!g.length) return;
    h += '<div class="grupa">' + esc(st) + ' (' + g.length + ')</div>';
    g.forEach(function (p) {
      h += '<div class="kartica klik" onclick="otvoriPrijem(\'' + esc(p.id) + '\')">' + cipStatusa(p.status) +
        '<div class="naslov">' + esc(p.naslov) + '</div>' +
        '<div class="sitno">' + esc(p.datum) + ' · ' + esc(p.zaposleni) + ' · ' + p.brStavki + ' stavki' +
        (S.admin ? ' · <b>' + esc(p.apoteka) + '</b>' : '') + '</div></div>';
    });
  });
  const ostali = pr.filter(function (p) { return STATUSI.indexOf(p.status) < 0; });
  if (ostali.length) {
    h += '<div class="grupa">Ostalo</div>';
    ostali.forEach(function (p) {
      h += '<div class="kartica klik" onclick="otvoriPrijem(\'' + esc(p.id) + '\')"><div class="naslov">' + esc(p.naslov) + '</div><div class="sitno">' + esc(p.status) + '</div></div>';
    });
  }
  h += '<div class="verzija">Alfa lek · Roba ' + VERZIJA_APP + '</div>';
  $('ekran').innerHTML = h;
  window.scrollTo(0, 0);
}

/* ---------- novi prijem ---------- */
function noviPrijem() {
  S.ekran = 'novi';
  postaviNaslov('Novi prijem', true);
  let h = '<div class="kartica"><label>Vrsta prijema</label><div class="izbor">' +
    '<button id="tF" class="akt" onclick="izaberiTip(\'Faktura\')">Faktura</button>' +
    '<button id="tI" onclick="izaberiTip(\'Interni prenos\')">Interni prenos</button></div>' +
    '<div id="poljeF"><label>Broj fakture</label><input id="brF" inputmode="text" autocomplete="off"></div>' +
    '<label id="lblD">Broj kalkulacije (može i kasnije)</label><input id="brD" inputmode="numeric" autocomplete="off">';
  if (S.admin) {
    h += '<label>Apoteka</label><select id="apo"><option value="">— izaberite —</option>' +
      S.apoteke.map(function (a) { return '<option>' + esc(a) + '</option>'; }).join('') + '</select>';
  }
  h += '<label>Vaše ime</label><input id="zap" value="' + esc(lsGet('zaposleni') || '') + '" autocomplete="off">' +
    '<button class="dugme zeleno" onclick="sacuvajPrijem()">Sačuvaj i počni skeniranje</button></div>';
  $('ekran').innerHTML = h;
  S.tip = 'Faktura';
  setTimeout(function () { $('brF').focus(); }, 100);
}
function izaberiTip(t) {
  S.tip = t;
  $('tF').classList.toggle('akt', t === 'Faktura'); $('tI').classList.toggle('akt', t !== 'Faktura');
  $('poljeF').classList.toggle('skriveno', t !== 'Faktura');
  $('lblD').textContent = t === 'Faktura' ? 'Broj kalkulacije (može i kasnije)' : 'Broj internog prenosa';
}
function sacuvajPrijem() {
  const d = { tip: S.tip, brojFakture: $('brF').value, brojDokumenta: $('brD').value, zaposleni: $('zap').value, apoteka: S.admin ? $('apo').value : '' };
  if (d.tip === 'Faktura' && !d.brojFakture.trim()) return poruka('Upišite broj fakture.', '#c62828');
  if (!d.zaposleni.trim()) return poruka('Upišite svoje ime.', '#c62828');
  if (S.admin && !d.apoteka) return poruka('Izaberite apoteku.', '#c62828');
  lsSet('zaposleni', d.zaposleni.trim());
  cekaj('Čuvam prijem...');
  apiP('apiNoviPrijem', d).then(function (id) {
    return apiP('apiPrijem', id);
  }).then(function (det) {
    gotovo(); S.prijem = det; S.prijemi.unshift(Object.assign({ brStavki: 0 }, det.prijem));
    poruka('Prijem je sačuvan.'); skener();
  }).catch(greska);
}

/* ---------- prijem ---------- */
function otvoriPrijem(id) {
  cekaj('Otvaram prijem...');
  apiP('apiPrijem', id).then(function (det) { gotovo(); S.prijem = det; S.izmenaBroja = false; prikaziPrijem(); }).catch(greska);
}

function zbirStavki() {
  const z = {}, red = [];
  S.prijem.stavke.forEach(function (s) {
    if (!z[s.idArtikla]) { z[s.idArtikla] = { idArtikla: s.idArtikla, naziv: s.naziv, kol: 0, stavke: [] }; red.push(z[s.idArtikla]); }
    z[s.idArtikla].kol += s.kol; z[s.idArtikla].stavke.push(s);
  });
  return red;
}

function prikaziPrijem() {
  zaustaviKameru();
  S.ekran = 'prijem';
  const p = S.prijem.prijem;
  postaviNaslov(p.naslov, true);
  const zbir = zbirStavki();
  const ukupno = S.prijem.stavke.reduce(function (a, s) { return a + s.kol; }, 0);
  const napZap = p.napomena.split('\n').filter(function (l) { return l.indexOf('⚙️') !== 0; }).join('\n');
  const napProg = p.napomena.split('\n').filter(function (l) { return l.indexOf('⚙️') === 0; }).join(' ');
  const imeBroja = p.tip === 'Faktura' ? 'Broj kalkulacije' : 'Broj internog prenosa';

  let h = '<div class="dokument">' + cipStatusa(p.status) +
    '<div class="oznaka">📄 ' + (p.tip === 'Faktura' ? 'Faktura' : 'Interni prenos') + '</div>' +
    '<div class="naslov">' + esc(p.naslov) + '</div>' +
    '<div class="sitno">' + esc(p.datum) + ' · ' + esc(p.zaposleni) + (S.admin ? ' · <b>' + esc(p.apoteka) + '</b>' : '') + '</div>' +
    (napProg ? '<div class="info">' + esc(napProg) + '</div>' : '');
  if (p.brojDokumenta && !S.izmenaBroja) {
    h += '<div class="dokRed"><div><div class="lbl">' + imeBroja + '</div><div class="vr">' + esc(p.brojDokumenta) + '</div></div>' +
      '<button class="dugme obrub malo" onclick="S.izmenaBroja=true;prikaziPrijem()">✏️ Izmeni</button></div>';
  } else {
    h += '<label>' + imeBroja + ' (iz programa, za proveru)</label>' +
      '<div class="red2"><input id="brD" value="' + esc(p.brojDokumenta) + '" inputmode="numeric" autocomplete="off" placeholder="npr. 050592">' +
      '<button class="dugme obrub" style="flex:0 0 110px;margin:0" onclick="sacuvajBroj()">Sačuvaj</button></div>';
  }
  h += '<div class="razmak"></div>' +
    '<button class="dugme zeleno" onclick="proveri()" ' + (S.prijem.stavke.length ? '' : 'disabled') + '>✅ Proveri</button>';
  if (S.prijem.rezultati.length) h += '<button class="dugme obrub" style="margin-bottom:0" onclick="prikaziRezultate()">📋 Rezultati poslednje provere</button>';
  h += '</div>';

  h += '<div class="deo">Unos robe</div>' +
    '<div class="red2"><button class="dugme njezno" onclick="skener()">📷 Skeniraj</button>' +
    '<button class="dugme njezno" onclick="rucno()">🔍 Ručno</button></div>' +
    (jeRacunar() ? '<div class="sitno">Bar kod čitač radi i na ovom ekranu – samo skenirajte.</div>' : '');

  h += '<div class="grupa">Skenirano: ' + zbir.length + ' artikala, ' + ukupno + ' kom</div>';
  if (!zbir.length) h += '<div class="info">Još ništa nije skenirano.</div>';
  zbir.forEach(function (z) {
    const komad = jeKomad(z.idArtikla);
    h += '<div class="kartica klik" onclick="izmeniArtikal(\'' + esc(z.idArtikla) + '\')"><div class="stavka"><div><div class="naslov' + (komad ? ' komad' : '') + '">' +
      esc(z.naziv) + '</div>' + (komad ? '<div class="sitno komad">⚠️ NA KOMAD</div>' : '') +
      (z.stavke.length > 1 ? '<div class="sitno">skenirano ' + z.stavke.length + ' puta</div>' : '') +
      '</div><div class="k">' + z.kol + '</div></div></div>';
  });
  h += '<div id="redStatus" class="ceka"></div>';
  h += '<label>Napomena</label><textarea id="nap" rows="2">' + esc(napZap) + '</textarea>' +
    '<button class="dugme obrub" onclick="sacuvajNapomenu()">Sačuvaj napomenu</button>' +
    '<div style="height:18px"></div><button class="dugme obrub-crv" onclick="obrisiPrijem()">🗑️ Obriši ovaj prijem</button>';
  $('ekran').innerHTML = h;
  osveziBrojac();
}

function sacuvajBroj() {
  cekaj('Čuvam...');
  apiP('apiIzmeniPrijem', S.prijem.prijem.id, { brojDokumenta: $('brD').value }).then(function (det) {
    gotovo(); S.prijem = det; S.izmenaBroja = false; prikaziPrijem(); poruka('Broj je sačuvan.');
  }).catch(greska);
}
function sacuvajNapomenu() {
  cekaj('Čuvam...');
  apiP('apiIzmeniPrijem', S.prijem.prijem.id, { napomena: $('nap').value }).then(function (det) {
    gotovo(); S.prijem = det; prikaziPrijem(); poruka('Napomena je sačuvana.');
  }).catch(greska);
}

function obrisiPrijem() {
  const p = S.prijem.prijem;
  if (!confirmLako('Obrisati prijem „' + p.naslov + '“ sa svih ' + S.prijem.stavke.length + ' skeniranih stavki?\n\nOvo se ne može vratiti.')) return;
  posleCuvanja(function () {
    cekaj('Brišem prijem...');
    apiP('apiObrisiPrijem', p.id).then(function () {
      gotovo();
      S.prijemi = S.prijemi.filter(function (x) { return x.id !== p.id; });
      poruka('Prijem je obrisan.'); lista();
    }).catch(greska);
  });
}

/* izmena količine / brisanje stavki jednog artikla */
function izmeniArtikal(idArtikla) {
  if (RED.lista.length || RED.radi) return posleCuvanja(function () { izmeniArtikal(idArtikla); });
  S.ekran = 'stavka';
  const z = zbirStavki().filter(function (x) { return x.idArtikla === idArtikla; })[0];
  if (!z) return prikaziPrijem();
  postaviNaslov('Izmena', true);
  let h = '<div class="kartica"><div class="naslov">' + esc(z.naziv) + '</div><div class="sitno">Ukupno: ' + z.kol + '</div></div>';
  z.stavke.forEach(function (s) {
    h += '<div class="kartica"><div class="sitno">' + esc(s.vreme) + (s.barkod ? ' · ' + esc(s.barkod) : ' · ručno') + '</div>' +
      '<div class="kol"><button onclick="pomeri(\'k_' + s.id + '\',-1)">−</button><input id="k_' + s.id + '" type="number" inputmode="decimal" value="' + s.kol + '">' +
      '<button onclick="pomeri(\'k_' + s.id + '\',1)">+</button></div>' +
      '<div class="red2"><button class="dugme zeleno" onclick="sacuvajKolicinu(\'' + s.id + '\')">Sačuvaj</button>' +
      '<button class="dugme obrub-crv" onclick="obrisiStavku(\'' + s.id + '\')">Obriši</button></div></div>';
  });
  h += '<button class="dugme obrub" onclick="prikaziPrijem()">Nazad na prijem</button>';
  $('ekran').innerHTML = h;
}
function pomeri(id, d) { const i = $(id); const v = Math.max(1, (parseFloat(i.value) || 0) + d); i.value = v; }
function sacuvajKolicinu(id) {
  const kol = parseFloat($('k_' + id).value);
  if (!(kol > 0)) return poruka('Količina mora biti veća od nule.', '#c62828');
  cekaj('Čuvam...');
  apiP('apiIzmeniStavku', id, kol).then(function () { return apiP('apiPrijem', S.prijem.prijem.id); })
    .then(function (det) { gotovo(); S.prijem = det; prikaziPrijem(); poruka('Količina je sačuvana.'); }).catch(greska);
}
function obrisiStavku(id) {
  if (!confirmLako('Obrisati ovu stavku?')) return;
  cekaj('Brišem...');
  apiP('apiObrisiStavku', id).then(function () { return apiP('apiPrijem', S.prijem.prijem.id); })
    .then(function (det) { gotovo(); S.prijem = det; prikaziPrijem(); poruka('Stavka je obrisana.'); }).catch(greska);
}

/* ---------- skeniranje u prijemu ---------- */
function skener() {
  S.ekran = 'skener';
  postaviNaslov('Skeniranje', true);
  const p = S.prijem.prijem;
  $('ekran').innerHTML =
    '<div class="sitno" style="margin-bottom:6px">' + esc(p.naslov) + ' · skenirano <b id="brSken">' + S.prijem.stavke.length + '</b> <span id="redStatus" class="ceka"></span></div>' +
    skenerDeo() +
    '<div class="red2"><button class="dugme njezno" onclick="$(\'foto\').click()">📸 Slikaj barkod</button>' +
    '<button class="dugme njezno" onclick="rucno()">🔍 Ručno</button></div>' +
    '<label>Ili ukucajte barkod</label><div class="red2"><input id="rucniKod" inputmode="numeric" autocomplete="off">' +
    '<button id="dugOK" class="dugme plavo" style="flex:0 0 90px;margin:0" onclick="prijemKod($(\'rucniKod\').value, true)">OK</button></div>' +
    '<div id="poslednje"></div>' +
    '<button class="dugme obrub" onclick="prikaziPrijem()">Gotovo – nazad na prijem</button>';
  osveziBrojac();
  pokreniSkener();
}

/* poslednjih 5 unetih stavki (vidi se odmah šta je upisano, posebno u brzom režimu) */
function osveziPoslednje() {
  if ($('brSken') && S.prijem) $('brSken').textContent = S.prijem.stavke.length;
  const el = $('poslednje');
  if (!el || !S.prijem) return;
  const st = S.prijem.stavke.slice(0, 5);
  el.innerHTML = st.length ? '<div class="poslednje"><div class="sitno" style="margin:2px 0 4px">Poslednje uneto:</div>' + st.map(function (s) {
    return '<div class="r"><span>' + esc(s.naziv) + (s.ceka ? ' <span class="ceka">⏳</span>' : '') + '</span><b>' + s.kol + '</b></div>';
  }).join('') + '</div>' : '';
}

/* kod iz bilo kog izvora (kamera, slika, kucanje, čitač) */
function prijemKod(kod, namerno) {
  kod = String(kod || '').trim();
  if (!kod) return;
  if (!S.prijem) return;
  if (S.ekran !== 'skener') skener();          // čitač na ekranu prijema ili ručnog izbora -> ekran skeniranja
  if (!SIF.ok) return poruka('Šifarnik se još učitava, pokušajte za trenutak.', '#fb8c00');
  if ($('rucniKod')) $('rucniKod').value = '';
  // čitačem skeniran novi artikal dok je kartica prethodnog otvorena: prethodni se sačuva sa upisanom količinom
  if (namerno && $('dugSacuvaj') && S.izabran) {
    const kolPre = parseFloat($('kolicina').value);
    if (kolPre > 0) { sacuvajArtikal(S.izabran, kolPre); poruka('✓ ' + S.izabran.naziv + ' × ' + kolPre); }
    S.izabran = null;
  }
  const a = nadjiArtikal(kod);
  if (!a) {
    CAM.pauza = true;
    zvuk(false);
    $('nadjeno').innerHTML = '<div class="upoz">Barkod ' + esc(ocistiKod(kod)) + ' nije u šifarniku.</div>' +
      '<div class="red2"><button class="dugme njezno" onclick="rucno(\'' + esc(ocistiKod(kod)) + '\')">🔍 Izaberi ručno</button>' +
      '<button class="dugme obrub" onclick="nastavi()">Skeniraj ponovo</button></div>';
    return;
  }
  if (SKEN.rezim === 'brzo' && !a.komad) {
    // brzi režim: odmah 1 kom
    CAM.pauza = false;
    zvuk(true);
    sacuvajArtikal(a, 1);
    $('nadjeno').innerHTML = '<div class="ok">✓ ' + esc(a.naziv) + ' · +1</div>';
    return;
  }
  CAM.pauza = true;
  zvuk(true);
  karticaArtikla(a, 'nadjeno');
  if (SKEN.rezim === 'brzo' && a.komad) poruka('Artikal na komad – upišite broj komada.', '#c62828');
}

function karticaArtikla(a, gde) {
  S.izabran = a;
  const vecIma = S.prijem.stavke.filter(function (s) { return s.idArtikla === a.id; }).reduce(function (x, s) { return x + s.kol; }, 0);
  $(gde).innerHTML = '<div class="kartica" style="border:3px solid ' + (a.komad ? '#c62828' : '#8a6fc4') + '">' +
    '<div class="naslov' + (a.komad ? ' komad' : '') + '">' + esc(a.naziv) + '</div>' +
    (a.komad ? '<div class="upoz">⚠️ ARTIKAL NA KOMAD! Upišite broj KOMADA (kesica, ampula), ne kutija.</div>' : '') +
    (vecIma ? '<div class="sitno">Već skenirano u ovom prijemu: ' + vecIma + '</div>' : '') +
    '<div class="kol"><button onclick="pomeri(\'kolicina\',-1)">−</button><input id="kolicina" type="number" inputmode="decimal" value="1">' +
    '<button onclick="pomeri(\'kolicina\',1)">+</button></div>' +
    '<div class="red2"><button class="dugme zeleno" id="dugSacuvaj" onclick="sacuvajStavku()">Sačuvaj' + (jeRacunar() ? ' (Enter)' : '') + '</button>' +
    '<button class="dugme obrub" onclick="otkazi()">Otkaži</button></div></div>';
  if (a.komad || jeRacunar()) setTimeout(function () { const i = $('kolicina'); if (i) { i.focus(); i.select(); } }, 60);
}

function otkazi() {
  if (!confirmLako('Otkazati unos ovog artikla? Neće biti sačuvan.')) return;
  nastavi();
}

function nastavi() {
  S.izabran = null;
  if ($('nadjeno')) $('nadjeno').innerHTML = '';
  if ($('rucniKod')) $('rucniKod').value = '';
  if (S.ekran === 'skener') { CAM.pauza = false; if (SKEN.kamera && !CAM.radi && $('kamDeo') && !$('kamDeo').classList.contains('skriveno')) pokreniKameru(); }
  else if (S.ekran === 'rucno') { const p = $('pretraga'); if (p) { p.value = ''; p.focus(); } $('rezPretrage').innerHTML = ''; }
}

/* upis stavke: odmah u spisak, slanje skripti u pozadini */
function sacuvajArtikal(a, kol) {
  const st = { id: noviId(), barkod: a.barkod || '', idArtikla: a.id, naziv: a.naziv, kol: kol };
  const lokalna = { id: st.id, barkod: st.barkod, idArtikla: st.idArtikla, naziv: st.naziv, kol: kol, vreme: 'sada', ms: Date.now(), ceka: true };
  const prijem = S.prijem;
  prijem.stavke.unshift(lokalna);
  uRed({
    url: modul('prijem').api, fn: 'apiDodajStavku', args: [prijem.prijem.id, st], naziv: a.naziv, kol: kol, lokalna: lokalna,
    ukloni: function () { const i = prijem.stavke.indexOf(lokalna); if (i >= 0) prijem.stavke.splice(i, 1); osveziPoslednje(); }
  });
}

function sacuvajStavku() {
  const a = S.izabran; const kol = parseFloat($('kolicina').value);
  if (!(kol > 0)) return poruka('Količina mora biti veća od nule.', '#c62828');
  sacuvajArtikal(a, kol);
  poruka('✓ ' + a.naziv + ' × ' + kol);
  // posle ručnog izbora: nazad na ekran za skeniranje; posle skeniranja: nastavlja se skeniranje
  if (S.ekran === 'rucno') skener(); else nastavi();
}

/* ---------- ručni izbor ---------- */
function rucno(pocetno) {
  zaustaviKameru();
  S.ekran = 'rucno';
  postaviNaslov('Ručni izbor artikla', true);
  $('ekran').innerHTML =
    (pocetno ? '<div class="info">Barkod ' + esc(pocetno) + ' nije u šifarniku – izaberite artikal po nazivu.</div>' : '') +
    '<input id="pretraga" placeholder="Upišite deo naziva (najmanje 3 slova)" autocomplete="off">' +
    '<div id="nadjeno"></div><div id="rezPretrage"></div>' +
    '<button class="dugme obrub" onclick="skener()">Nazad na skeniranje</button>';
  $('pretraga').addEventListener('input', pretrazi);
  setTimeout(function () { $('pretraga').focus(); }, 100);
}

function pretrazi() {
  const q = $('pretraga').value.trim().toLowerCase();
  if (q.length < 3) { $('rezPretrage').innerHTML = ''; return; }
  const delovi = q.split(/\s+/);
  const rez = [];
  for (let i = 0; i < SIF.a.length && rez.length < 40; i++) {
    const n = SIF.a[i][1].toLowerCase();
    if (delovi.every(function (d) { return n.indexOf(d) >= 0; })) rez.push(i);
  }
  $('rezPretrage').innerHTML = rez.length ? rez.map(function (i) {
    const a = SIF.a[i];
    return '<div class="kartica klik" onclick="izaberiRucno(' + i + ')"><div class="naslov' + (a[2] ? ' komad' : '') + '">' + esc(a[1]) +
      '</div><div class="sitno">ID ' + esc(a[0]) + (a[2] ? ' · <span class="komad">⚠️ na komad</span>' : '') + '</div></div>';
  }).join('') : '<div class="info">Nema artikla sa tim nazivom.</div>';
}

function izaberiRucno(i) {
  const a = SIF.a[i];
  $('rezPretrage').innerHTML = '';
  karticaArtikla({ id: a[0], naziv: a[1], komad: a[2] === 1, barkod: '' }, 'nadjeno');
  window.scrollTo(0, 0);
}

/* ---------- provera i rezultati ---------- */
function proveri() {
  const p = S.prijem.prijem;
  if (!p.brojDokumenta) return poruka('Prvo upišite broj ' + (p.tip === 'Faktura' ? 'kalkulacije' : 'internog prenosa') + ' i kliknite Sačuvaj.', '#fb8c00');
  posleCuvanja(function () { proveriSada(p); });
}
function proveriSada(p) {
  cekaj('Proveravam... (do pola minuta)');
  apiP('apiProveri', p.id).then(function (r) {
    gotovo(); S.prijem = r.detalji;
    const i = S.prijemi.findIndex(function (x) { return x.id === p.id; });
    if (i >= 0) S.prijemi[i].status = r.status;
    prikaziRezultate();
  }).catch(greska);
}

/* [oznaka, pozadina, boja teksta, naziv u legendi] */
const VRSTE = [
  ['MANJAK', '#ffcdd2', '#b71c1c', '🔴 Manjak'], ['VISAK', '#ffe0b2', '#e65100', '🟠 Višak'],
  ['NEMA_POS', '#e1bee7', '#4a148c', '🟣 Nema u pošiljci'], ['NEMA_DOK', '#bbdefb', '#0d47a1', '🔵 Nema u dokumentu'],
  ['KOMAD_OK', '#fff9c4', '#827717', '⚠️ Na komad'], ['OK', '#e8f5e9', '#1b5e20', '✅ Slaže se']
];
function vrstaRez(st) {
  if (st.indexOf('Manjak') >= 0) return VRSTE[0]; if (st.indexOf('Višak') >= 0) return VRSTE[1];
  if (st.indexOf('pošiljci') >= 0) return VRSTE[2]; if (st.indexOf('dokumentu') >= 0) return VRSTE[3];
  if (st.indexOf('⚠️') === 0) return VRSTE[4]; return VRSTE[5];
}

function prikaziRezultate() {
  zaustaviKameru();
  S.ekran = 'rezultat';
  const p = S.prijem.prijem;
  postaviNaslov('Rezultat provere', true);
  const boja = p.status === 'U redu' ? '#2e7d32' : p.status === 'Ima grešaka' ? '#c62828' : '#e65100';
  const ikona = p.status === 'U redu' ? '✅ ' : p.status === 'Ima grešaka' ? '❗ ' : '⚠️ ';
  const prog = p.napomena.split('\n').filter(function (l) { return l.indexOf('⚙️') === 0; }).join(' ').replace(/^⚙️\s*/, '');
  let h = '<div class="dokument"><div class="naslov" style="color:' + boja + ';font-size:20px">' + ikona + esc(p.status) + '</div>' +
    '<div class="sitno">' + esc(p.naslov) + (p.vremeProvere ? ' · ' + esc(p.vremeProvere) : '') + '</div>' +
    (prog ? '<div style="margin-top:8px">' + esc(prog) + '</div>' : '') +
    (p.status === 'Nema dokumenta' ? '<div class="info">Izvezite dokument u folder Dokumenti, proverite broj u prijemu i ponovo kliknite ✅ Proveri.</div>' : '') +
    '</div>';
  const rez = S.prijem.rezultati;
  if (rez.length) {
    const brojac = {};
    rez.forEach(function (r) { const v = vrstaRez(r.status)[0]; brojac[v] = (brojac[v] || 0) + 1; });
    h += '<div class="legenda">' + VRSTE.map(function (v) {
      return brojac[v[0]] ? '<span style="background:' + v[1] + ';color:' + v[2] + '">' + esc(v[3]) + ': ' + brojac[v[0]] + '</span>' : '';
    }).join('') + '</div>';
    rez.forEach(function (r) {
      const v = vrstaRez(r.status);
      h += '<div class="kartica" style="background:' + v[1] + '"><div class="naslov" style="color:' + v[2] + '">' + esc(r.naziv) + '</div>' +
        '<div style="font-weight:bold;color:' + v[2] + '">' + esc(r.status) + '</div>' +
        '<div class="sitno" style="color:#333">Na dokumentu: <b>' + r.d + '</b> · Skenirano: <b>' + r.s + '</b> · Razlika: <b>' + (r.razlika > 0 ? '+' : '') + r.razlika + '</b></div></div>';
    });
  }
  h += '<div class="red2"><button class="dugme njezno" onclick="skener()">📷 Doskeniraj</button>' +
    '<button class="dugme obrub" onclick="prikaziPrijem()">Prijem</button></div>' +
    '<button class="dugme obrub" onclick="lista();prijemOsvezi()">Na listu prijema</button>';
  $('ekran').innerHTML = h;
  window.scrollTo(0, 0);
}

start();
</script>
</body>
</html>
